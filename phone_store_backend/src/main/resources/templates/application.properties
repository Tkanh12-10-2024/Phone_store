# Cấu hình Port chạy Backend
server.port=8080

# Cấu hình Kết nối MySQL XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/phone_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Cấu hình JPA / Hibernate tự động sinh/cập nhật Bảng từ Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true