spring.datasource.url=jdbc:mysql://localhost:3306/quanly_cuahang_dienthoai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema được quản lý bằng file SQL riêng.
# Không để Hibernate tự sửa cấu trúc database.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Không tự động chạy schema H2 trên MySQL
spring.sql.init.mode=never
