# Port chạy ứng dụng Backend
server.port=8080

# Cấu hình kết nối MySQL XAMPP (mặc định port 3306, user root, mật khẩu trống)
spring.datasource.url=jdbc:mysql://localhost:3306/phone_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate tự động cập nhật bảng vào XAMPP
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true