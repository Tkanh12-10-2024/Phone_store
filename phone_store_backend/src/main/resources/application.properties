
spring.application.name=phone-store-backend

# Cổng chạy REST API
server.port=8080

# Profile mặc định khi chạy ứng dụng local
# Có thể ghi đè bằng --spring.profiles.active=h2
spring.profiles.default=mysql

# Múi giờ
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Local product image storage
phone-store.upload-dir=uploads/products
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
